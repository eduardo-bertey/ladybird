name: Android part build
description: >
  Compila UNA sola parte de Ladybird para Android arm64-v8a usando CMake+NDK
  directamente (sin Gradle). Error rápido por librería: si una parte falla,
  el log muestra solo esa parte. Se corre una parte por vez, en orden
  (01-core -> 02-gfx -> 03-js -> 04-media -> 05-web -> 06-webview -> 07-browser);
  las dependencias ya verdes se reutilizan desde ccache/vcpkg.

inputs:
  target:
    description: Target CMake a compilar (LibCore, LibGfx, LibJS, LibMedia, LibWeb, LibWebView, ladybird)
    required: true
  extra-targets:
    description: Otros targets a compilar despues (separados por espacio, mismo log). Para juntar todas las .so del APK.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set Up Environment
      id: setup
      uses: ./.github/actions/setup
      with:
        os: 'Android'
        arch: 'Lagom'

    - name: Export dirs + install NDK and SDK components
      shell: bash
      run: |
        # OJO: el runner trae pipefail activado y `yes` muere con SIGPIPE cuando
        # sdkmanager cierra stdin (aunque todo salga bien). Por eso NO se confía
        # en el exit code de sdkmanager: se verifica por EFECTO.
        set -eux
        {
          echo "LADYBIRD_SOURCE_DIR=${{ github.workspace }}"
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"
          # El setup crea Build/vcpkg-release (preset Release de ladybird.py),
          # NO Build/vcpkg: apuntar ahi o el toolchain de vcpkg no existe.
          echo "VCPKG_ROOT=${{ github.workspace }}/Build/vcpkg-release"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/Build/caches/vcpkg-binary-cache,readwrite"
        } >> "$GITHUB_ENV"
        yes 2>/dev/null | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/sdk-licenses.log 2>&1 || true
        grep -q "All SDK package licenses accepted" /tmp/sdk-licenses.log || { tail -30 /tmp/sdk-licenses.log; exit 1; }
        yes 2>/dev/null | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" > /tmp/sdk-install.log 2>&1 || true
        test -d "${ANDROID_SDK_ROOT}/platform-tools" || { tail -30 /tmp/sdk-install.log; exit 1; }
        yes 2>/dev/null | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13599879" > /tmp/sdk-ndk.log 2>&1 || true
        test -d "${ANDROID_SDK_ROOT}/ndk/29.0.13599879" || { tail -30 /tmp/sdk-ndk.log; ls "${ANDROID_SDK_ROOT}/ndk" 2>/dev/null; exit 1; }
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/29.0.13599879" >> "$GITHUB_ENV"

    - name: Add Rust Android target
      shell: bash
      run: rustup target add aarch64-linux-android

    - name: Restore Caches
      uses: ./.github/actions/cache-restore
      id: cache-restore
      with:
        os: 'Android'
        arch: 'Lagom'
        toolchain: 'Clang'
        cache_key_extra: 'Android Lib Parts'
        ccache_path: ${{ steps.setup.outputs.ccache_path }}
        vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}

    # OJO: se construye SIEMPRE (aunque el target no sea LibJS): el configure de
    # CMake arma todo el proyecto y LibJS corta con FATAL_ERROR si no hay
    # generador del host (Libraries/LibJS/CMakeLists.txt).
    - name: Build Host Tools
      shell: bash
      run: |
        set -euxo pipefail
        export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/29.0.13599879"
        test -d "$ANDROID_NDK_HOME" || { echo "NDK not found at $ANDROID_NDK_HOME"; ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null; exit 1; }
        mkdir -p Build/host-tools
        # AK/Debug.h and AK/Backtrace.h are generated by CMake; create them here.
        sed 's/#    cmakedefine01 \(.*\)/#define \1 0/' AK/Debug.h.in > AK/Debug.h
        sed -e 's/^#cmakedefine Backtrace_FOUND/\/\/ Backtrace_FOUND not defined/' -e 's/@Backtrace_HEADER@//' AK/Backtrace.h.in > AK/Backtrace.h
        # Libraries have generated *_API export headers; stub them out for the host tool.
        for d in Libraries/*/; do
          name=$(basename "$d")
          api="$(echo "${name#Lib}" | tr '[:lower:]' '[:upper:]')_API"
          printf '#pragma once\n#define %s\n' "$api" > "$d/Export.h"
        done
        # The host tool links AK, which needs simdutf and mimalloc as real libraries, plus the
        # fmt and fast_float headers. Android-triplet .a libs cannot link into a macOS binary,
        # so install these four for the HOST triplet (arm64-osx), pinned to the same versions
        # the root vcpkg.json resolves (classic mode cannot be version-pinned, so use a small
        # standalone manifest with overrides + the same builtin-baseline as the root manifest).
        HOST_MANIFEST_DIR="${{ github.workspace }}/Build/host-tools/vcpkg-manifest"
        mkdir -p "$HOST_MANIFEST_DIR"
        cat > "$HOST_MANIFEST_DIR/vcpkg.json" <<'EOF'
        {
          "name": "ladybird-host-tools",
          "version": "1",
          "dependencies": [ "simdutf", "mimalloc", "fmt", "fast-float" ],
          "overrides": [
            { "name": "simdutf", "version": "9.1.0" },
            { "name": "mimalloc", "version": "2.2.7" },
            { "name": "fmt", "version": "12.2.0", "port-version": 1 },
            { "name": "fast-float", "version": "8.2.10", "port-version": 1 }
          ],
          "builtin-baseline": "7f3781e19cc7d4e4882a4caec01668c6f7b5c163"
        }
        EOF
        cat > "$HOST_MANIFEST_DIR/vcpkg-configuration.json" <<'EOF'
        {
          "overlay-ports": [ "../../../Meta/CMake/vcpkg/overlay-ports" ]
        }
        EOF
        cd "$HOST_MANIFEST_DIR"
        "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx \
          --binarysource="clear;files,${{ github.workspace }}/Build/caches/vcpkg-binary-cache,readwrite"
        cd "${{ github.workspace }}"
        HOST_VCPKG_INSTALLED="$HOST_MANIFEST_DIR/vcpkg_installed/arm64-osx"
        # generate_interpreter_layout must run on the build host (macOS), so build it for the host.
        # AK requires a C++23 compiler with deducing-this support (clang >= 18), so use brew's llvm@21.
        # The *Windows.cpp sources are Windows-only and must be excluded on macOS.
        AK_SOURCES=""
        for f in AK/*.cpp; do
          case "$f" in
            *Windows.cpp) continue ;;
          esac
          AK_SOURCES="$AK_SOURCES $f"
        done
        "$(brew --prefix llvm@21)/bin/clang++" -std=c++23 -O1 -fno-exceptions -fsigned-char \
          -I. -ILibraries \
          -I"$HOST_VCPKG_INSTALLED/include" \
          -DFMT_HEADER_ONLY \
          -Dprivate=public -Dprotected=public \
          -Wno-everything \
          $AK_SOURCES Libraries/LibJS/Interpreter/GenerateLayout.cpp \
          "$HOST_VCPKG_INSTALLED/lib/libsimdutf.a" \
          "$HOST_VCPKG_INSTALLED/lib/libmimalloc.a" \
          -Wl,-U,_ak_assertion_handler \
          -o Build/host-tools/generate_interpreter_layout

    - name: Configure CMake (arm64-v8a only)
      shell: bash
      run: |
        set -euxo pipefail
        test -d "$ANDROID_NDK_HOME" || { echo "NDK not found at $ANDROID_NDK_HOME"; exit 1; }
        # Mismos flags que UI/Android/build.gradle.kts le pasa a CMake (solo ABI arm64-v8a
        # para error rapido; el APK oficial compila tambien x86_64 via Gradle).
        ARGS=( -S "${{ github.workspace }}" -B "${{ github.workspace }}/Build/android-arm64" -G Ninja
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-30
          -DANDROID_NDK="$ANDROID_NDK_HOME"
          -DANDROID_STL=c++_shared
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DVCPKG_TARGET_ANDROID=ON
          -DLADYBIRD_CACHE_DIR="${{ github.workspace }}/Build/caches"
          -DENABLE_CRANELIFT_JIT=OFF
          -DLADYBIRD_HOST_LAYOUT_GENERATOR="${{ github.workspace }}/Build/host-tools/generate_interpreter_layout" )
        cmake "${ARGS[@]}"

    - name: Build ${{ inputs.target }}
      shell: bash
      run: |
        set -euxo pipefail
        cmake --build "${{ github.workspace }}/Build/android-arm64" --target "${{ inputs.target }}" 2>&1 | tee "${{ github.workspace }}/Build/${{ inputs.target }}-android-arm64.log"
        for t in ${{ inputs.extra-targets }}; do
          cmake --build "${{ github.workspace }}/Build/android-arm64" --target "$t" 2>&1 | tee -a "${{ github.workspace }}/Build/${{ inputs.target }}-android-arm64.log"
        done

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.target }}-android-arm64-log
        path: ${{ github.workspace }}/Build/${{ inputs.target }}-android-arm64.log
        if-no-files-found: warn

    - name: Save Caches
      if: always()
      uses: ./.github/actions/cache-save
      with:
        arch: 'Lagom'
        ccache_path: ${{ steps.setup.outputs.ccache_path }}
        ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
        vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}
        vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}
