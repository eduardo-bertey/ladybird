name: Android parte 05 - Web (LibWeb)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1

      # La parte mas pesada: el runner limita a 2 compilaciones en paralelo
      # (CMAKE_JOB_POOL_COMPILE, ver CMakeLists.txt) para no quedarse sin memoria.
      - name: Compilar LibWeb para arm64-v8a
        uses: ./.github/actions/android-part
        with:
          target: LibWeb
