name: Android parte 07 - Navegador (lib ladybird)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1

      # Ultima puerta antes del APK: compila la lib JNI nativa completa
      # (UI/Android + bundle, igual que el paso nativo de android-build.yml).
      # Correr solo cuando 01..06 estan verdes.
      - name: Compilar ladybird para arm64-v8a
        uses: ./.github/actions/android-part
        with:
          target: ladybird

      # Las 4 .so del APK (ladybird + 3 servicios, todas en lib/): se suben como
      # artifact porque los runners son efimeros y el Build/ muere con ellos.
      # OJO: libLadybird.so con L mayuscula, el glob es case-sensitive.
      # Se usa lib/*.so y NO **/*.so para no arrastrar .so de vcpkg_installed.
      - name: Subir .so
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-sos
          path: ${{ github.workspace }}/Build/android-arm64/lib/*.so
          if-no-files-found: error
