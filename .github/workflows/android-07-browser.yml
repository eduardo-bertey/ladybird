name: Android parte 07 - Navegador (lib ladybird)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1

      # Ultima puerta antes del APK: compila la lib JNI nativa completa
      # (UI/Android + bundle, igual que el paso nativo de android-build.yml).
      # Correr solo cuando 01..06 estan verdes.
      - name: Compilar ladybird para arm64-v8a
        uses: ./.github/actions/android-part
        with:
          target: ladybird

      # La lib nativa NO se pierde: se sube como artifact (los runners son
      # efimeros y el Build/ muere con ellos).
      - name: Subir libladybird.so
        uses: actions/upload-artifact@v4
        with:
          name: libladybird-arm64-so
          path: ${{ github.workspace }}/Build/android-arm64/**/libladybird.so
          if-no-files-found: error
