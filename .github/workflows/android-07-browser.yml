name: Android parte 07 - Navegador (lib ladybird)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1

      # Ultima puerta antes del APK: compila la lib JNI nativa completa
      # (UI/Android + bundle, igual que el paso nativo de android-build.yml).
      # Correr solo cuando 01..06 estan verdes.
      - name: Compilar ladybird para arm64-v8a
        uses: ./.github/actions/android-part
        with:
          target: ladybird

      - name: Subir .so
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-sos
          path: ${{ github.workspace }}/Build/android-arm64/lib/*.so
          if-no-files-found: error

      # ladybird-assets.zip lo genera CMake (copy-assets) en el source tree.
      # Con prebuilt Gradle no corre CMake: hay que pasarlo por artifact.
      - name: Subir assets
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-android-assets
          path: ${{ github.workspace }}/UI/Android/src/main/assets/ladybird-assets.zip
          if-no-files-found: error
