name: Android Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  # runner.workspace = /home/runner/work/ladybird
  # github.workspace = /home/runner/work/ladybird/ladybird
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  VCPKG_ROOT:  ${{ github.workspace }}/Build/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/Build/caches/vcpkg-binary-cache,readwrite

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set Up Environment
        id: 'setup'
        uses: ./.github/actions/setup
        with:
          os: 'Android'
          arch: 'Lagom'

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      # === PREPARE FOR BUILDING ===

      - name: Restore Caches
        uses: ./.github/actions/cache-restore
        id: 'cache-restore'
        with:
          os: 'Android'
          arch: 'Lagom'
          toolchain: 'Clang'
          cache_key_extra: 'Android Build'
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}

      - name: Install NDK and SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13599879"

      - name: Build Host Tools
        run: |
          set -euxo pipefail
          mkdir -p Build/host-tools
          # AK/Debug.h is generated by CMake; create it with all debug flags off.
          sed 's/#    cmakedefine01 \(.*\)/#define \1 0/' AK/Debug.h.in > AK/Debug.h
          # Libraries have generated *_API export headers; stub them out for the host tool.
          for d in Libraries/*/; do
            name=$(basename "$d")
            api="$(echo "${name#Lib}" | tr '[:lower:]' '[:upper:]')_API"
            printf '#pragma once\n#define %s\n' "$api" > "$d/Export.h"
          done
          # generate_interpreter_layout must run on the build host (macOS), so build it for the host.
          xcrun clang++ -std=c++23 -O1 -fno-exceptions -fsigned-char \
            -I. -ILibraries \
            -Dprivate=public -Dprotected=public \
            -Wno-everything \
            AK/*.cpp Libraries/LibJS/Interpreter/GenerateLayout.cpp \
            -o Build/host-tools/generate_interpreter_layout

      # === BUILD ===

      - name: Build APK
        working-directory: ${{ github.workspace }}/UI/Android
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: '-Xmx3072m'
          LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
          LADYBIRD_HOST_LAYOUT_GENERATOR: ${{ github.workspace }}/Build/host-tools/generate_interpreter_layout

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-apk
          path: UI/Android/build/outputs/apk/*/app-*.apk
          if-no-files-found: error

      - name: Save Caches
        if: always()
        uses: ./.github/actions/cache-save
        with:
          arch: 'Lagom'
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}
