name: Android Build

# Arma el APK con las .so PREBUILT del artifact ladybird-android-sos
# (workflow android-09-sos). Gradle solo compila Java/Kotlin y empaqueta:
# NO recompila nativo (el runner no tiene disco para vcpkg+nativo x2 ABIs).
# Las .so las construyen las partes (01..09) con error rapido por libreria.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK (solo para llvm-strip)
        run: |
          yes 2>/dev/null | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes 2>/dev/null | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13599879" > /dev/null 2>&1 || true
          test -d "${ANDROID_SDK_ROOT}/ndk/29.0.13599879"

      - name: Download prebuilt .so (latest green android-07-browser)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow android-07-browser.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "Usando .so del run $RUN_ID"
          rm -rf UI/Android/src/main/jniLibs
          mkdir -p UI/Android/src/main/jniLibs/arm64-v8a
          gh run download "$RUN_ID" --repo "${{ github.repository }}" -n ladybird-android-sos -D UI/Android/src/main/jniLibs/arm64-v8a/
          find UI/Android/src/main/jniLibs -name "*.so"

      - name: Build ladybird-assets.zip (recursos, sin CMake ni NDK)
        run: |
          set -eux
          cd "${{ github.workspace }}"
          # Mismo contenido que genera copy-assets en AndroidExtras.cmake:
          # zip -r de asset-bundle/ (mismo comando, sin compilar nada).
          # Layout PLANO como desktop (share/Lagom/{ladybird,fonts,icons,themes},
          # SIN nivel res/): el resource root en Android es files/ y
          # resource://ladybird/X debe resolver a files/ladybird/X.
          rm -rf asset-bundle
          mkdir -p asset-bundle/ladybird/site-compatibility
          cp -r Base/res/ladybird Base/res/fonts Base/res/icons Base/res/themes asset-bundle/
          cp WebCompat/*.json asset-bundle/ladybird/site-compatibility/
          mkdir -p UI/Android/src/main/assets
          (cd asset-bundle && zip -qr ../ladybird-assets.zip ./)
          mv ladybird-assets.zip UI/Android/src/main/assets/
          unzip -l UI/Android/src/main/assets/ladybird-assets.zip | head -10

      - name: Strip .so + agregar libc++_shared (sacar debug symbols, achica ~10x)
        run: |
          set -eux
          LLVM_STRIP=$(echo "${ANDROID_SDK_ROOT}/ndk/29.0.13599879/toolchains/llvm/prebuilt/"*/bin/llvm-strip)
          du -sh UI/Android/src/main/jniLibs/arm64-v8a/
          "$LLVM_STRIP" --strip-unneeded UI/Android/src/main/jniLibs/arm64-v8a/*.so
          # Con ANDROID_STL=c++_shared hay que empaquetar libc++_shared.so del
          # NDK (antes lo copiaba Gradle solo via externalNativeBuild; con
          # prebuilt no, y sin el explota con UnsatisfiedLinkError en el celu).
          cp "${ANDROID_SDK_ROOT}/ndk/29.0.13599879/toolchains/llvm/prebuilt/"*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so UI/Android/src/main/jniLibs/arm64-v8a/
          du -sh UI/Android/src/main/jniLibs/arm64-v8a/
          find UI/Android/src/main/jniLibs -name "*.so"

      - name: Build APK (prebuilt native, arm64-v8a)
        working-directory: ${{ github.workspace }}/UI/Android
        run: ./gradlew assembleDebug -PusePrebuiltNative=true
        env:
          GRADLE_OPTS: '-Xmx3072m'
          LADYBIRD_BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-apk
          path: UI/Android/build/outputs/apk/*/*.apk
          if-no-files-found: error
